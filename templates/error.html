{% extends "base.html" %}

{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5 text-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
            <div class="display-1 fw-bold text-primary mb-2">{{ code }}</div>
            <h4 class="fw-bold text-dark mb-2">{{ title }}</h4>
            <p class="text-muted small mb-4">{{ message }}</p>
            <div>
                <a href="{{ url_for('dashboard') if current_user else url_for('login') }}" class="btn btn-primary rounded-pill px-4 shadow-sm">
                    <i class="bi bi-house-door-fill me-1"></i> Return to Safety
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
